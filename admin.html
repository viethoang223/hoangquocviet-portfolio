<html lang="vi">
<head>

<style>:root{--bg:#0a0b10;--panel:#0d1117;--white:#fff;--dim:rgba(255,255,255,.58);--line:rgba(255,255,255,.1);--lime:#c8f000;--cyan:#22d3ee;--warm:#ff6b35;--pink:#ff2d87;--violet:#a78bfa}*{box-sizing:border-box}html,body{min-width:320px;min-height:100%;margin:0;background:var(--bg);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px}#adminRoot{width:min(100%,520px)}.login-form{display:grid;gap:14px;padding:24px;border:1px solid var(--line);border-radius:16px;background:#0d1117;box-shadow:0 24px 70px rgba(0,0,0,.38)}.login-top{display:flex;align-items:center;justify-content:space-between;gap:14px}.login-brand{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}.login-langs{display:flex;gap:5px}.login-langs button{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--dim);padding:6px 9px;font-size:10px;font-weight:800;cursor:pointer}.login-langs button.active{background:rgba(255,255,255,.1);color:#fff}.login-form h1{font-size:23px;line-height:1.2;margin:8px 0 0}.login-form>p{margin:0;color:var(--dim);font-size:12px;line-height:1.6}.login-field{display:grid;gap:6px;color:var(--dim);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.login-field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#080b10;color:#fff;font:inherit;letter-spacing:normal;text-transform:none}.login-field input:focus{outline:2px solid rgba(34,211,238,.35);border-color:var(--cyan)}.login-submit{min-height:42px;border:1px solid var(--lime);border-radius:999px;background:var(--lime);color:#090b0e;font-size:11px;font-weight:900;cursor:pointer}.login-submit:disabled{opacity:.55;cursor:wait}.login-status{padding:10px;border-radius:8px;font-size:11px;line-height:1.5}.login-status[hidden]{display:none}.login-status.error{border:1px solid rgba(248,113,113,.25);background:rgba(127,29,29,.16);color:#fca5a5}.login-status.pending{border:1px solid rgba(34,211,238,.25);background:rgba(34,211,238,.06);color:#9cecf4}noscript{display:block;padding:10px;color:#fca5a5;font-size:12px}@media(max-width:600px){body{padding:14px}.login-form{padding:19px}}

.admin-dialog{width:min(900px,95vw);height:min(92dvh,920px);max-height:min(92dvh,920px);background:#0d1117;border:1px solid rgba(255,255,255,.12);border-radius:20px;color:#fff}
.admin-dialog::backdrop{background:rgba(0,0,0,.78);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.admin-scroll{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:22px}
.admin-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.08)}
.admin-kicker{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.admin-title{margin-top:5px;font-size:23px;font-weight:950;letter-spacing:-.03em}
.admin-close{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);cursor:pointer}
.admin-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:16px;margin-top:18px}.admin-card{padding:17px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.025)}
.admin-card h3{font-size:12px;font-weight:900;letter-spacing:.03em}.admin-card p,.admin-note{margin-top:7px;color:var(--dim);font-size:11px;line-height:1.6}
.admin-form{display:grid;gap:10px;margin-top:12px}.admin-label{font-size:9px;font-weight:850;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}.admin-input,.admin-select{width:100%;margin-top:5px;padding:10px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.10);background:#080b10;color:#fff;outline:0}.admin-input:focus,.admin-select:focus{border-color:rgba(34,211,238,.46)}
.admin-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.admin-btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);color:#fff;font-size:10px;font-weight:900;cursor:pointer}.admin-btn.primary{background:var(--lime);border-color:var(--lime);color:#0a0b10}.admin-btn.danger{border-color:rgba(248,113,113,.24);color:#fca5a5}.admin-btn:disabled{opacity:.48;cursor:wait}.admin-status{margin-top:10px;padding:9px 10px;border-radius:9px;font-size:10px;line-height:1.5;display:none}.admin-status.show{display:block}.admin-status.ok{background:rgba(200,240,0,.06);border:1px solid rgba(200,240,0,.18);color:var(--lime)}.admin-status.err{background:rgba(127,29,29,.18);border:1px solid rgba(248,113,113,.20);color:#fca5a5}
.admin-proof-list{display:grid;gap:8px;margin-top:12px}.admin-proof{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:11px;background:rgba(255,255,255,.02)}.admin-proof strong{display:block;font-size:10px;line-height:1.35}.admin-proof span{display:block;margin-top:4px;color:var(--dim);font-size:9px;word-break:break-word}.admin-proof-rich{grid-template-columns:minmax(0,1fr);align-items:start}.admin-proof-main{min-width:0}.admin-proof-thumb{display:block;width:100%;max-height:170px;overflow:hidden;border-radius:9px;margin-bottom:8px;background:rgba(255,255,255,.03)}.admin-proof-thumb img{display:block;width:100%;height:170px;object-fit:cover}.admin-proof-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.admin-proof-actions .admin-btn,.admin-proof-actions a.admin-btn{font-size:9px;padding:7px 9px;text-decoration:none}.admin-proof-rich span{line-height:1.55}.admin-empty{padding:14px;border:1px dashed rgba(255,255,255,.10);border-radius:11px;color:var(--dim);font-size:10px;line-height:1.55}.admin-asset-sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.admin-asset-card{padding:17px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.025)}.admin-asset-card h3{font-size:12px;font-weight:900}.admin-asset-card p{margin-top:7px;color:var(--dim);font-size:11px;line-height:1.6}@media(max-width:760px){.admin-asset-sections{grid-template-columns:1fr}}
.admin-config{margin-top:15px;padding:11px;border-radius:10px;border:1px solid rgba(255,107,53,.20);background:rgba(255,107,53,.05);color:#ffc0ab;font-size:10px;line-height:1.55}
.admin-project-management{margin-top:16px;padding:17px;border:1px solid rgba(34,211,238,.14);border-radius:15px;background:linear-gradient(145deg,rgba(34,211,238,.035),rgba(255,255,255,.018))}
.admin-project-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.admin-project-list{display:grid;gap:8px;margin-top:12px}
.admin-project-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:11px;background:rgba(255,255,255,.02)}
.admin-project-row strong{display:block;font-size:11px;line-height:1.35}
.admin-project-meta{display:block;margin-top:4px;color:var(--dim);font-size:9px;line-height:1.5}
.admin-project-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.admin-project-media{margin-top:16px;padding:15px;border:1px solid rgba(200,240,0,.12);border-radius:13px;background:rgba(200,240,0,.025)}.admin-media-list{display:grid;gap:8px;margin-top:10px}.admin-media-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 11px;border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.018)}.admin-media-main{min-width:0}.admin-media-main strong{display:block;font-size:10px;line-height:1.35}.admin-media-main span{display:block;margin-top:4px;color:var(--dim);font-size:9px;line-height:1.45;overflow-wrap:anywhere}.admin-media-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.admin-media-actions .admin-btn{font-size:9px;padding:7px 9px}@media(max-width:760px){.admin-media-row{grid-template-columns:1fr}.admin-media-actions{justify-content:flex-start}}
.admin-project-editor{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}
.admin-project-editor[hidden]{display:none}
.admin-section-editor{display:grid;gap:10px;margin-top:10px}
.admin-section-row{padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:11px;background:rgba(255,255,255,.018)}
.admin-section-editor-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
.admin-section-order{color:var(--dim);font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
.admin-block-list{display:grid;gap:8px;margin-top:10px}
.admin-block{border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(0,0,0,.12);overflow:hidden;cursor:grab}.admin-block.is-dragging{opacity:.45;border-color:rgba(34,211,238,.4)}.admin-block-type-select{width:auto;min-width:150px;margin-top:0;padding:8px 30px 8px 10px}
.admin-block-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
.admin-block-head strong{font-size:9px;color:var(--cyan);letter-spacing:.09em;text-transform:uppercase}
.admin-block-actions{display:flex;gap:5px;flex-wrap:wrap}
.admin-block-actions .admin-btn{min-height:30px;padding:0 9px;font-size:8px}
.admin-block-body{padding:10px}
.admin-block-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.admin-block-field{display:grid;gap:4px}
.admin-block-field.full{grid-column:1/-1}
.admin-block-field>span{font-size:8px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
.admin-block-input,.admin-block-textarea{width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,.09);border-radius:9px;background:#080b10;color:#fff;outline:0;font-size:10px;line-height:1.5}
.admin-block-textarea{min-height:70px;resize:vertical}
.admin-block-input:focus,.admin-block-textarea:focus{border-color:rgba(34,211,238,.46)}
.admin-block-preview{margin-top:10px;padding:12px;border-top:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.012)}
.admin-block-preview-label{color:var(--dim);font:8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase}
.admin-block-preview-content{margin-top:7px;max-height:280px;overflow:auto}
.admin-block-preview-content .case-copy{margin-top:0;font-size:11px;line-height:1.65}
.admin-block-preview-content .case-flow{margin-top:4px}
.admin-block-preview-content .article-media{margin-top:4px}
.admin-block-empty{padding:12px;border:1px dashed rgba(255,255,255,.09);border-radius:9px;color:var(--dim);font-size:9px;line-height:1.5}.admin-richtext-wrap{border:1px solid rgba(255,255,255,.09);border-radius:9px;background:#080b10;overflow:hidden}.admin-richtext-toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025)}.admin-richtext-toolbar button{min-width:30px;min-height:28px;padding:0 8px;border:1px solid rgba(255,255,255,.08);border-radius:6px;background:transparent;color:#fff;font-size:10px;cursor:pointer}.admin-richtext-toolbar button:hover,.admin-richtext-toolbar button:focus-visible{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.06);outline:0}.admin-richtext-editor{min-height:150px;padding:11px 12px;outline:0;color:#fff;font-size:11px;line-height:1.7;overflow:auto;word-break:break-word;overflow-wrap:anywhere}.admin-richtext-editor:empty:before{content:attr(data-placeholder);color:var(--dim)}.admin-richtext-editor h2,.admin-richtext-editor h3{margin:14px 0 7px;line-height:1.2}.admin-richtext-editor p{margin:7px 0}.admin-richtext-editor ul,.admin-richtext-editor ol{padding-left:22px;margin:7px 0}.admin-richtext-editor blockquote{margin:10px 0;padding:8px 12px;border-left:2px solid var(--cyan);color:var(--muted);background:rgba(255,255,255,.025)}.admin-richtext-editor a{color:var(--cyan);text-decoration:underline}.admin-image-picker{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}.admin-image-picker-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.admin-image-picker select{flex:1;min-width:220px}.admin-image-meta{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:8px;border:1px solid rgba(255,255,255,.07);border-radius:9px;background:rgba(255,255,255,.018)}.admin-image-thumb{width:96px;height:72px;object-fit:contain;background:#05070a;border-radius:6px;border:1px solid rgba(255,255,255,.07)}.admin-image-meta strong{display:block;font-size:10px;line-height:1.4;overflow-wrap:anywhere}.admin-image-meta small{display:block;color:var(--dim);font-size:8px;line-height:1.5;margin-top:3px}.admin-image-empty{padding:9px;border:1px dashed rgba(255,255,255,.09);border-radius:8px;color:var(--dim);font-size:9px}.admin-image-remove{white-space:nowrap}.admin-image-search{width:100%;padding:8px 10px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:#080b10;color:#fff;font-size:9px;outline:0}.admin-image-search:focus{border-color:rgba(34,211,238,.46)}.admin-section-row-head-actions{display:flex;gap:5px;flex-wrap:wrap}.admin-section-row-head-actions .admin-btn{min-height:28px;padding:0 8px;font-size:8px}.admin-project-preview-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px;border:1px solid rgba(34,211,238,.14);border-radius:10px;background:rgba(34,211,238,.025)}.admin-project-preview-bar span{font-size:9px;color:var(--dim)}@media(max-width:760px){.admin-image-meta{grid-template-columns:72px 1fr}.admin-image-thumb{width:72px;height:60px}.admin-richtext-toolbar button{min-width:34px}}
@media(max-width:760px){.admin-block-grid{grid-template-columns:1fr}.admin-section-editor-toolbar{align-items:flex-start}.admin-block-actions{justify-content:flex-start}}

.admin-section-row-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.admin-section-row-head strong{font-size:10px;color:var(--cyan)}
.admin-textarea{width:100%;min-height:82px;margin-top:5px;padding:10px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.10);background:#080b10;color:#fff;outline:0;resize:vertical}
.admin-textarea:focus{border-color:rgba(34,211,238,.46)}
.admin-project-json{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.5}
.visitor-admin-summary{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;color:rgba(255,255,255,.60);font-size:10px}
.visitor-admin-summary span{padding:8px 10px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:rgba(255,255,255,.025)}
.visitor-admin-summary strong{color:var(--lime);font-size:12px}
.visitor-admin-list{display:grid;gap:7px;max-height:420px;margin-top:12px;overflow:auto;overscroll-behavior:contain}
.visitor-admin-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px;border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.02)}
.visitor-admin-rank{color:var(--cyan);font:10px ui-monospace,SFMono-Regular,Menlo,monospace}
.visitor-admin-ip{min-width:0}
.visitor-admin-ip strong{display:block;overflow-wrap:anywhere;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
.visitor-admin-ip span{display:block;margin-top:4px;color:var(--dim);font-size:9px;line-height:1.5}
.visitor-admin-count{color:var(--lime);font-size:10px;white-space:nowrap}
.visitor-admin .admin-project-head{align-items:center}
@media(max-width:760px){.admin-project-row{grid-template-columns:1fr}.admin-project-actions{justify-content:flex-start}}

@media(max-width:760px){.admin-grid{grid-template-columns:1fr}.admin-row{grid-template-columns:1fr}.admin-dialog{width:100vw;height:100dvh;max-height:none;border-radius:0;border-left:0;border-right:0}.admin-scroll{padding:18px 15px 28px}}


.admin-status.warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.42);color:#fbbf24}
.media-library-dialog{width:min(1120px,96vw);max-width:none;height:min(88dvh,900px);max-height:min(88dvh,900px);padding:0;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:#0d1117;color:#fff;overflow:hidden}
.media-library-dialog::backdrop{background:rgba(0,0,0,.68);backdrop-filter:blur(6px)}
.media-library-shell{height:100%;display:flex;flex-direction:column;min-height:0}
.media-library-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px 22px;border-bottom:1px solid rgba(255,255,255,.08)}
.media-library-head h3{margin:0 0 5px;font-size:18px}
.media-library-head p{margin:0;color:rgba(255,255,255,.58);font-size:12px}
.media-library-toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 130px 150px auto auto;gap:10px;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.08)}

.media-library-toolbar input,.media-library-toolbar select{min-width:0}
.media-library-body{display:grid;grid-template-columns:minmax(0,1fr) 280px;min-height:0;flex:1}
.media-library-grid{min-width:0;overflow:auto;padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));align-content:start;gap:12px}

.media-library-detail dl{margin:0;display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;font-size:11px}
.media-library-detail dt{color:rgba(255,255,255,.42)}
.media-library-detail dd{margin:0;word-break:break-word}
.media-library-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 22px;border-top:1px solid rgba(255,255,255,.08)}
.media-library-actions{display:flex;gap:8px;flex-wrap:wrap}
.admin-gallery-items{display:grid;gap:8px;margin-top:10px}
.admin-gallery-item{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:9px;align-items:center;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:7px;background:rgba(255,255,255,.025)}
.admin-gallery-item img{width:58px;height:44px;object-fit:contain;background:#090c11;border-radius:7px}

.admin-gallery-item span{font-size:10px;color:rgba(255,255,255,.48)}
.admin-gallery-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.admin-gallery-actions .admin-btn{padding:5px 7px;font-size:10px}

    if (!response.ok) {
      const detail = await response.text().catch(() => '');
      if ((response.status === 400 || response.status === 404) && /portfolio_admins|pgrst20[45]|does not exist|schema cache/i.test(detail)) throw new Error('schema_missing');
      if (response.status === 401 || response.status === 403) throw new Error('not_authorized');
      if (response.status >= 500) throw new Error('network');
      throw new Error('not_authorized');
    }
    const rows = await response.json();
    if (!Array.isArray(rows) || !rows.length) {
      throw new Error('not_authorized');
    }
    persist();
    HQVShared.auth = authProvider();
    form.hidden = true;
    await loadAdminScript();
    window.HQVAdmin.mount(root);
  }
  function loadAdminScript() {
    if (window.HQVAdmin) return Promise.resolve();
    if (loadPromise) return loadPromise;
    loadPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = './admin.js?v=20261020-project-proof-refresh-1';
      script.onload = resolve;
      script.onerror = () => reject(new Error('admin_script_load_failed'));
      document.body.append(script);
    });
    return loadPromise;
  }
  function errorMessage(error) {
    if (error.message === 'schema_missing') return copyText[currentLang].schema;
    if (error.message === 'not_authorized') return copyText[currentLang].unauthorized;
    if (error.message === 'network' || error.message === 'supabase_network_error') return copyText[currentLang].network;
    return copyText[currentLang].failed;
  }
  async function submit(event) {
    event.preventDefault();
    if (busy) return;
    busy = true;
    form.querySelector('button[type="submit"]').disabled = true;
    setStatus(currentLang === 'en' ? 'Signing in…' : 'Đang đăng nhập…', 'pending');
    try {
      const response = await fetch(`${config.url.replace(/\/$/, '')}/auth/v1/token?grant_type=password`, {
        method: 'POST', headers: HQVShared.sbHeaders(), body: JSON.stringify({ email: form.elements.email.value.trim(), password: form.elements.password.value })
      });
      if (!response.ok) throw new Error('invalid_credentials');
      await authorize(await response.json());
    } catch (error) {
      const failedSession = session;
      session = null;
      await signOutRemote(failedSession);
      persist();
      HQVShared.auth = null;
      setStatus(errorMessage(error));
    } finally {
      busy = false;
      form.querySelector('button[type="submit"]').disabled = false;
    }
  }
  form.addEventListener('submit', submit);
  langButtons.forEach(button => button.addEventListener('click', () => {
    currentLang = button.dataset.lang;
    localStorage.setItem('hqv-lang', currentLang);
    paintLanguage();
  }));
  paintLanguage();
  const saved = sessionStorage.getItem('hqv-admin-session');
  if (saved) {
    try {
      authorize(JSON.parse(saved)).catch(error => {
        const failedSession = session;
        session = null;
        signOutRemote(failedSession);
        persist();
        HQVShared.auth = null;
        setStatus(errorMessage(error));
      });
    } catch (_) { persist(); }
  }
})();
</script>
</body>
